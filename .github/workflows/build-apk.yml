name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files
        run: |
          mkdir www
          cp app.html www/index.html

      - name: Create Android project
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/share@7 @capacitor/filesystem@7 @capacitor/app@7
          echo '{"appId":"com.albinr.billbookapp","appName":"Zharvi Bill","webDir":"www"}' > capacitor.config.json
          npx cap add android

      - name: Bluetooth printer plugin
        run: |
          APP=android/app/src/main/java/com/albinr/billbookapp
          cp $APP/MainActivity.java /tmp/MainActivity.orig
          cat > $APP/BtPrinterPlugin.java <<'EOF'
          package com.albinr.billbookapp;

          import android.Manifest;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothSocket;
          import android.os.Build;
          import android.util.Base64;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;
          import java.io.OutputStream;
          import java.util.Set;
          import java.util.UUID;

          @CapacitorPlugin(name = "BtPrinter", permissions = { @Permission(alias = "bt", strings = { Manifest.permission.BLUETOOTH_CONNECT, Manifest.permission.BLUETOOTH_SCAN }) })
          public class BtPrinterPlugin extends Plugin {
            private static final UUID SPP = UUID.fromString("00001101-0000-1000-8000-00805F9B34FB");

            private boolean needPerm() {
              return Build.VERSION.SDK_INT >= 31 && getPermissionState("bt") != PermissionState.GRANTED;
            }

            @PluginMethod
            public void list(PluginCall call) {
              if (needPerm()) { requestPermissionForAlias("bt", call, "listPerm"); return; }
              doList(call);
            }

            @PermissionCallback
            private void listPerm(PluginCall call) {
              if (getPermissionState("bt") == PermissionState.GRANTED) doList(call);
              else call.reject("Bluetooth permission denied");
            }

            private void doList(PluginCall call) {
              try {
                BluetoothAdapter ad = BluetoothAdapter.getDefaultAdapter();
                if (ad == null) { call.reject("No Bluetooth on this phone"); return; }
                if (!ad.isEnabled()) { call.reject("Turn Bluetooth ON"); return; }
                JSArray arr = new JSArray();
                Set<BluetoothDevice> set = ad.getBondedDevices();
                for (BluetoothDevice d : set) {
                  JSObject o = new JSObject();
                  o.put("name", d.getName());
                  o.put("address", d.getAddress());
                  arr.put(o);
                }
                JSObject r = new JSObject();
                r.put("devices", arr);
                call.resolve(r);
              } catch (Exception e) {
                call.reject(String.valueOf(e.getMessage()));
              }
            }

            @PluginMethod
            public void print(PluginCall call) {
              if (needPerm()) { requestPermissionForAlias("bt", call, "printPerm"); return; }
              doPrint(call);
            }

            @PermissionCallback
            private void printPerm(PluginCall call) {
              if (getPermissionState("bt") == PermissionState.GRANTED) doPrint(call);
              else call.reject("Bluetooth permission denied");
            }

            private void doPrint(final PluginCall call) {
              final String addr = call.getString("address");
              final String data = call.getString("data");
              if (addr == null || data == null) { call.reject("Missing printer or data"); return; }
              new Thread(new Runnable() {
                @Override
                public void run() {
                  BluetoothSocket s = null;
                  try {
                    BluetoothAdapter ad = BluetoothAdapter.getDefaultAdapter();
                    if (ad == null || !ad.isEnabled()) { call.reject("Turn Bluetooth ON"); return; }
                    ad.cancelDiscovery();
                    BluetoothDevice d = ad.getRemoteDevice(addr);
                    s = d.createRfcommSocketToServiceRecord(SPP);
                    try {
                      s.connect();
                    } catch (Exception e1) {
                      try { s.close(); } catch (Exception ig) { }
                      s = (BluetoothSocket) d.getClass().getMethod("createRfcommSocket", new Class[] { int.class }).invoke(d, 1);
                      s.connect();
                    }
                    OutputStream os = s.getOutputStream();
                    byte[] b = Base64.decode(data, Base64.DEFAULT);
                    int off = 0;
                    while (off < b.length) {
                      int n = Math.min(512, b.length - off);
                      os.write(b, off, n);
                      os.flush();
                      off += n;
                      Thread.sleep(25);
                    }
                    Thread.sleep(400);
                    call.resolve();
                  } catch (Exception e) {
                    call.reject("Print failed: " + e.getMessage());
                  } finally {
                    if (s != null) { try { s.close(); } catch (Exception ig) { } }
                  }
                }
              }).start();
            }
          }
          EOF
          cat > $APP/MainActivity.java <<'EOF'
          package com.albinr.billbookapp;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(BtPrinterPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          EOF
          M=android/app/src/main/AndroidManifest.xml
          cp $M /tmp/Manifest.orig
          sed -i 's#<application#<uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />\n    <application#' $M

      - name: App icon
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in android/app/src/main/res/mipmap-*; do
            cp icon.png "$d/ic_launcher.png"
            cp icon.png "$d/ic_launcher_round.png"
            cp icon.png "$d/ic_launcher_foreground.png"
          done

      - name: Fixed signing key and version
        run: |
          mkdir -p ~/.android
          echo '' | base64 -d > ~/.android/debug.keystore
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -n "versionCode" android/app/build.gradle

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug || {
            echo "Bluetooth plugin failed to compile - building without it"
            APP=app/src/main/java/com/albinr/billbookapp
            rm -f $APP/BtPrinterPlugin.java
            cp /tmp/MainActivity.orig $APP/MainActivity.java
            cp /tmp/Manifest.orig app/src/main/AndroidManifest.xml
            ./gradlew assembleDebug
          }

      - uses: actions/upload-artifact@v4
        with:
          name: bill-book-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
