name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files
        run: |
          mkdir www
          echo '' | base64 -d | gunzip > www/index.html
          echo '' | base64 -d > icon.png

      - name: Create Android project
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          echo '{"appId":"com.albinr.billbookapp","appName":"Bill Book","webDir":"www"}' > capacitor.config.json
          npx cap add android

      - name: App icon
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in android/app/src/main/res/mipmap-*; do
            cp icon.png "$d/ic_launcher.png"
            cp icon.png "$d/ic_launcher_round.png"
            cp icon.png "$d/ic_launcher_foreground.png"
          done

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: bill-book-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
