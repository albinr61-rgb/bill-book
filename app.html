<meta charset="utf-8">
<title>Zharvi Bill</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Hind+Madurai:wght@400;500;600;700&display=swap">
<style>
/* Layout: single 480px phone column; sticky shop header, 3-column tile grid, fixed bottom nav with raised Sale button. */
:root{
  --bg:#f6f4fb; --surface:#ffffff; --fg:#1d1a2b; --muted:#6a647c; --line:#e2dcf0;
  --accent:#6a3fc2; --accent2:#8660d6; --accent-fg:#ffffff; --accent-soft:#eee8fb;
  --good:#1a8247; --good-soft:#dff3e7; --warn:#a85f08; --warn-soft:#fbecd5; --bad:#b93526; --bad-soft:#fae0dc;
  --f-display:'Bricolage Grotesque','Hind Madurai',system-ui,sans-serif;
  --f-body:'Hind Madurai',system-ui,-apple-system,'Segoe UI',sans-serif;
  --shadow:0 1px 2px rgba(40,25,80,.07),0 4px 14px rgba(40,25,80,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141120; --surface:#1e1a30; --fg:#ece8f7; --muted:#9c94b5; --line:#322b4a;
  --accent:#a78bf5; --accent2:#8b6fe0; --accent-fg:#1b1033; --accent-soft:#2b2247;
  --good:#4cc27f; --good-soft:#163526; --warn:#e3a247; --warn-soft:#3a2a12; --bad:#f08072; --bad-soft:#3d1e1a;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141120; --surface:#1e1a30; --fg:#ece8f7; --muted:#9c94b5; --line:#322b4a;
  --accent:#a78bf5; --accent2:#8b6fe0; --accent-fg:#1b1033; --accent-soft:#2b2247;
  --good:#4cc27f; --good-soft:#163526; --warn:#e3a247; --warn-soft:#3a2a12; --bad:#f08072; --bad-soft:#3d1e1a;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:110px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;padding:10px 0}
.avatar{width:42px;height:42px;border-radius:12px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font:800 17px var(--f-display);flex:none}
.hd{min-width:0;flex:1}
.hd b{display:block;font:700 18px var(--f-display);line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd small{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);flex:none}
.local{font-size:12px;color:var(--muted);background:var(--accent-soft);border-radius:999px;padding:3px 10px;white-space:nowrap}

.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
h2{font:700 20px var(--f-display);margin:4px 0 0;text-wrap:balance}
h3{font:700 15px var(--f-display);margin:0}
.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}

.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
.sum .lbl{display:block;margin-bottom:2px}
.sum b{font:700 18px var(--f-display)}
.c-good{color:var(--good)}.c-bad{color:var(--bad)}.c-warn{color:var(--warn)}.c-acc{color:var(--accent)}
select.pick{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.tile .ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center}
.t-in .ic{background:var(--good-soft);color:var(--good)}
.t-out .ic{background:var(--bad-soft);color:var(--bad)}
.t-due .ic{background:var(--warn-soft);color:var(--warn)}
.t-n .ic{background:var(--accent-soft);color:var(--accent)}
.tile b{font-weight:600;font-size:13.5px;line-height:1.15}
.tile small{font-size:11.5px;color:var(--muted);line-height:1.1}
.tile:active{transform:scale(.97)}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:500;font-size:14px}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{padding:8px 6px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12.5px;color:var(--muted);font-weight:600}
.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 12px;min-width:0}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.search{position:relative}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search .in{padding-left:36px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;background:var(--accent);color:var(--accent-fg);font-weight:700}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%}
.btn.armed{background:var(--bad);color:#fff}
.btn.sm{padding:6px 12px;font-size:13.5px;border-radius:9px}

.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item .t{min-width:0;flex:1}
.item .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t small{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .r{text-align:right;flex:none}
.item .r b{display:block}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.pill.low{background:var(--warn-soft);color:var(--warn)}
.pill.out{background:var(--bad-soft);color:var(--bad)}
.pill.paid{background:var(--good-soft);color:var(--good)}
.pill.due{background:var(--warn-soft);color:var(--warn)}

.cartrow{padding:10px 0;border-bottom:1px solid var(--line)}
.cartrow:last-child{border-bottom:0}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qty button{width:32px;height:32px;display:grid;place-items:center}
.qty span{min-width:34px;text-align:center;font-weight:600}
.rate{width:84px;padding:6px 8px;text-align:right}
.totals div{display:flex;justify-content:space-between;padding:3px 0}
.totals .big{font:800 22px var(--f-display);padding-top:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.in.sm{padding:7px 9px;font-size:14px}
.dsc{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;width:112px;background:var(--surface)}
.dsc span{padding:7px 10px;font-weight:700;color:var(--surface)}
.dsc .p{background:var(--warn)}.dsc .a{background:var(--accent)}
.dsc input{width:100%;min-width:0;border:0;padding:7px 8px;text-align:right;background:var(--surface);outline:none}
.savebar{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));margin-top:14px;z-index:5}
.savebar .btn{width:100%;padding:14px;font-size:16px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.picklist{max-height:230px;overflow:auto;margin:0 -4px;padding:0 4px}

nav.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;z-index:25;background:var(--surface);
  border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;
  padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
nav.bar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px;font-weight:600;color:var(--muted)}
nav.bar button.on{color:var(--accent)}
nav.bar .fab{position:relative}
nav.bar .fab span{position:absolute;top:-34px;left:50%;transform:translateX(-50%);width:62px;height:62px;border-radius:50%;background:var(--accent);color:var(--accent-fg);
  display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.25);border:4px solid var(--bg)}
nav.bar .fab em{font-style:normal;margin-top:30px;color:var(--accent)}
.fabadd{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:15;height:50px;padding:0 20px;border-radius:25px;background:var(--accent);color:var(--accent-fg);font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.25)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:40;max-width:90vw;text-align:center}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13.5px}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.bill{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.bill hr{border:0;border-top:1px dashed var(--line);margin:8px 0}
table{width:100%;border-collapse:collapse}
td,th{padding:6px 0;text-align:left;font-weight:500;vertical-align:top}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
td.r,th.r{text-align:right}
textarea.in{min-height:96px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.app,nav.bar{max-width:640px}
.ff{position:relative;border:1px solid var(--line);border:1px solid color-mix(in srgb,var(--accent) 50%,var(--line));border-radius:12px;background:var(--surface);min-width:0}
.ff:focus-within{box-shadow:0 0 0 3px var(--accent-soft)}
.ff label{position:absolute;top:-9px;left:12px;background:var(--bg);padding:0 5px;font-size:12px;color:var(--muted);z-index:1}
.ff.acc label{color:var(--accent);font-weight:600}
.ff input,.ff select,.ff textarea{width:100%;border:0;background:transparent;padding:15px 40px 12px 14px;outline:none;appearance:none;-webkit-appearance:none;min-width:0;border-radius:12px}
.ff textarea{min-height:84px;resize:vertical;font-family:inherit;font-size:15px}
.ff .fi,.selwrap .fi{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--accent);pointer-events:none;display:flex}
.selwrap{position:relative}.selwrap select{appearance:none;-webkit-appearance:none;padding-right:38px}
.card.nopad{padding:0;overflow:hidden}
.shead{display:flex;align-items:center;gap:8px;background:var(--accent-soft);color:var(--accent);padding:12px 14px}
.shead b{font:700 15px var(--f-display)}
.badge{margin-left:auto;background:var(--accent);color:var(--accent-fg);min-width:24px;height:24px;border-radius:12px;display:grid;place-items:center;font-size:13px;font-weight:700;padding:0 7px}
.pill-x{margin-left:auto;background:var(--bad-soft);color:var(--bad);border-radius:999px;padding:4px 14px;font-weight:600;font-size:13px}
.ibody{padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.icard{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface)}
.irow{display:grid;grid-template-columns:44px 1fr auto;grid-template-areas:"th nm sd" "ds ds ds";gap:8px 10px;align-items:start}
.thumb{grid-area:th;width:44px;height:44px;border-radius:10px;background:var(--accent-soft);color:var(--muted);display:grid;place-items:center}

.idisc{grid-area:ds;display:flex;gap:8px;flex-wrap:wrap}
.iside{grid-area:sd;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.stk{color:var(--accent);font-size:12.5px;background:var(--accent-soft);padding:2px 8px;border-radius:6px;white-space:nowrap}

.calc{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--muted);padding:6px 10px;border-radius:8px;font-size:13px}
.qty button:last-child{background:var(--accent);color:var(--accent-fg)}
.btn.out{border:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.btn.out.warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;border-bottom:1px dashed var(--line)}
.srow:last-child{border-bottom:0}
.sl{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--accent)}.sl.muted{color:var(--muted);font-weight:500}
.srow.tot .sl{font:700 19px var(--f-display)}.srow.tot b{font:800 22px var(--f-display);color:var(--accent)}
.dsc{width:128px}.dsc.o{border-color:var(--warn)}.dsc.v{border-color:var(--accent)}
.dsc .t-o{background:var(--warn)}.dsc .t-v{background:var(--accent);color:var(--accent-fg)}
.dsc.sm{width:116px}.dsc.sm span{padding:4px 9px}.dsc.sm input{padding:4px 6px;font-size:14px}
.btn.dis{background:var(--line);color:var(--muted)}

.qfill b{font-size:12.5px}
.top.sub{display:grid;grid-template-columns:40px 1fr 40px;gap:8px}
.top.sub .iconbtn{color:var(--accent)}
.ttl{text-align:center;font:700 19px var(--f-display);color:var(--accent)}
.actions{display:grid;grid-template-columns:1fr 1.4fr;gap:12px}
.actions .btn{padding:14px;font-size:16px}
.btn.save{background:linear-gradient(90deg,var(--accent),var(--accent2))}
.btn.draft{background:var(--surface);border:1px solid var(--warn);color:var(--warn);box-shadow:0 6px 20px rgba(0,0,0,.1)}
.app.sub{padding-bottom:40px}
.app.sub main{padding-top:12px}
.app.sub .fabadd{bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.app.sub .savebar{bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.ff input[type=date]{padding-right:10px}
.hdisc{margin-left:auto;display:flex;align-items:stretch;border:1px solid var(--warn);border-radius:10px;overflow:hidden;background:var(--surface)}
.hdisc span{padding:4px 9px;font-weight:700;font-size:13px;background:var(--warn);color:var(--surface);display:flex;align-items:center;white-space:nowrap}
.hdisc input{width:64px;min-width:0;border:0;padding:4px 8px;background:transparent;text-align:right;outline:none;font-size:14px;color:var(--fg)}
.hdisc+.badge{margin-left:8px}
.drow{flex:1;justify-content:flex-end;min-width:0}
.srow .dsc{flex:1 1 0;width:auto;max-width:140px;min-width:84px}
.app.sub .savebar{background:var(--bg);padding:10px 0 12px;margin-top:6px}
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:2px solid var(--line)}
.tabs button{padding:13px 8px;font:600 16px var(--f-display);color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.bigtabs{background:var(--surface-2,#eee);border:0;border-radius:10px;overflow:hidden;gap:0}.bigtabs button{padding:15px 8px;margin:0;border:0;border-radius:10px;color:var(--ink)}.tabs.bigtabs button.on{border:0;background:var(--accent);color:var(--accent-fg)}
.whc{position:relative;border-radius:22px;box-shadow:var(--shadow);background:radial-gradient(circle at 100% 0,var(--accent-soft) 0 54px,transparent 55px),var(--surface)}.whm{position:relative;display:flex;align-items:center;gap:16px;width:100%;padding:18px;text-align:left;background:none;border:0;font:inherit;color:inherit}.whm .t{display:flex;flex-direction:column;gap:6px;min-width:0}.whm b{font:700 20px var(--f-display)}.whm small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:15px}.whm small .i{width:16px;height:16px}.whi{width:64px;height:64px;border-radius:18px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}.whk{position:absolute;right:10px;top:18px;width:40px;height:40px;border:0;background:none;color:var(--ink);display:grid;place-items:center}.whk .i{stroke-width:3.2}.whmenu{position:absolute;right:14px;top:56px;z-index:3;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.18);display:flex;flex-direction:column;min-width:150px;overflow:hidden}.whmenu button{padding:13px 16px;text-align:left;background:none;border:0;font:inherit;color:var(--ink)}.whmenu .bad{color:var(--bad)}
.dsc{width:100%;box-sizing:border-box;border-radius:14px;padding:12px 14px;background:radial-gradient(circle at 100% 0,var(--cs) 0 40px,transparent 41px),var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-width:0}.dsc span{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink)}.dsc span .i{color:var(--c)}.dsc b{font:700 22px var(--f-display);color:var(--c)}
.stf{position:relative;display:flex;align-items:center;gap:16px;width:100%;box-sizing:border-box;padding:18px;border-radius:22px;border:0;text-align:left;font:inherit;color:inherit;box-shadow:var(--shadow);background:radial-gradient(circle at 100% 0,var(--accent-soft) 0 52px,transparent 53px),var(--surface)}.stf .t{display:flex;flex-direction:column;gap:6px;min-width:0}.stf .t b{font:700 20px var(--f-display)}.stf .t small{color:var(--muted);font-size:15px;overflow:hidden;text-overflow:ellipsis}.sav{width:56px;height:56px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 22px var(--f-display);flex:none}.rp{font-style:normal;align-self:flex-start;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:4px 12px;font-size:14px}

const PERIODS={daily:'Today',weekly:'Last 7 days',monthly:'This month',all:'All time'};
function inP(d,p){p=p||DB.ui.period;if(p==='all')return true;if(p==='daily')return d===today();if(p==='weekly')return d>=addDays(-6)&&d<=today();return d.slice(0,7)===today().slice(0,7)}
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
function bal(p){let b=num(p.opening);
  if(p.type==='customer'){DB.sales.forEach(s=>{if(s.partyId===p.id)b+=s.total-s.paid});DB.returns.forEach(r=>{if(r.partyId===p.id)b-=r.amount})}else{DB.purchases.forEach(s=>{if(s.partyId===p.id)b+=s.total-s.paid})}
  DB.pays.forEach(x=>{if(x.partyId===p.id)b-=x.amount});return Math.round(b*100)/100}
function pl(per){
  const R=DB.returns.filter(r=>inP(r.date,per)),S=DB.sales.filter(s=>inP(s.date,per)),P=DB.purchases.filter(s=>inP(s.date,per)),C=DB.cash.filter(c=>inP(c.date,per));
  const revenue=sum(S,s=>s.sub-s.discount+(s.extra||0))-sum(R,r=>sum(r.items,i=>i.net)),cogs=sum(S,s=>sum(s.items,i=>i.qty*i.cost))-sum(R,r=>sum(r.items,i=>i.qty*i.cost)),gross=revenue-cogs;
  const exp=sum(C.filter(c=>c.type==='expense'),c=>c.amount),inc=sum(C.filter(c=>c.type==='income'),c=>c.amount);
  return{S,P,sale:sum(S,s=>s.total)-sum(R,r=>r.amount),purchase:sum(P,s=>s.total),gst:sum(S,s=>s.gst)-sum(R,r=>sum(r.items,i=>i.amt-i.net)),revenue,cogs,gross,exp,inc,net:gross+inc-exp};
}

function calc(c){const extra=sum(c.extras,e=>num(e.a)),t=totals(c.items,c.dp,c.da,extra),ps=sum(c.pays,p=>p.amt),implicit=!c.pays.length;
  const paid=implicit?(c.partyId?0:t.total):Math.min(ps,t.total);return Object.assign(t,{base:t.sub+t.gst,implicit,paid,due:r2(t.total-paid),remain:r2(Math.max(0,t.total-ps))})}
function odv(c,t){if(c.dp)return[c.dp,String(t.discount)];if(num(c.da))return[String(t.base?r2(num(c.da)/t.base*100):0),c.da];return['','']}
function hint(c,t){if(t.implicit)return c.partyId?'No payment added. The full amount will be saved as balance due.':'No payment added. This will be saved as fully paid in cash.';return t.due>0?'Balance due '+money(t.due):'Fully paid'}

const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtD=d=>{const D=new Date(d+'T00:00:00');return pad(D.getDate())+'-'+MON[D.getMonth()]+'-'+D.getFullYear()};
function rangeOf(){const p=UI.lp,d=UI.ld||today(),D=new Date(d+'T00:00:00');
  if(p==='all')return null;if(p==='custom')return[UI.cf||today(),UI.ct||today()];if(p==='daily')return[d,d];
  if(p==='weekly'){const w=(D.getDay()+6)%7,a=new Date(D);a.setDate(D.getDate()-w);const e=new Date(a);e.setDate(a.getDate()+6);return[ymd(a),ymd(e)]}
  if(p==='monthly')return[ymd(new Date(D.getFullYear(),D.getMonth(),1)),ymd(new Date(D.getFullYear(),D.getMonth()+1,0))];
  return[D.getFullYear()+'-01-01',D.getFullYear()+'-12-31']}
const inRange=d=>{const r=rangeOf();return !r||(d>=r[0]&&d<=r[1])};
function shiftRef(n){const D=new Date((UI.ld||today())+'T00:00:00'),p=UI.lp;if(p==='daily')D.setDate(D.getDate()+n);else if(p==='weekly')D.setDate(D.getDate()+7*n);else if(p==='monthly')D.setMonth(D.getMonth()+n,1);else if(p==='yearly')D.setFullYear(D.getFullYear()+n);UI.ld=ymd(D)}
const listKind=()=>cur.name==='purchases'?'purchase':'sale';
function listData(){const kind=listKind(),isS=kind==='sale',q=UI.lq.trim().toLowerCase(),ret=isS&&UI.stab==='return';
  if(ret)return{kind,ret,a:DB.returns.filter(r=>inRange(r.date)&&(!q||(r.no+' '+r.saleNo+' '+r.partyName).toLowerCase().includes(q))).sort((x,y)=>y.date.localeCompare(x.date)||y.no.localeCompare(x.no))};
  return{kind,ret,a:(isS?DB.sales:DB.purchases).filter(s=>inRange(s.date)&&(!q||(s.no+' '+s.partyName).toLowerCase().includes(q))).sort((x,y)=>y.date.localeCompare(x.date)||y.no.localeCompare(x.no))}}
const emptyX=(t,s,i)=>`<div class="emptyx">${ico(i||'purchase',72)}<b>${t}</b><p>${s}</p></div>`;

const byDate=(x,y)=>(y.date||y.d).localeCompare(x.date||x.d);

/* accounts */
function acctEntries(a){const E=[],add=(d,t,amt)=>E.push({d,t,amt});
  DB.sales.forEach(s=>payList(s).forEach(p=>{if(acctOf(p.mode)===a)add(s.date,'Sale '+s.no,p.amt)}));
  DB.purchases.forEach(s=>payList(s).forEach(p=>{if(acctOf(p.mode)===a)add(s.date,'Purchase '+s.no,-p.amt)}));
  DB.pays.forEach(x=>{if(acctOf(x.mode)!==a)return;const q=partyOf(x.partyId)||{type:'customer',name:''};add(x.date,(q.type==='customer'?'Collection ':'Payment ')+q.name,q.type==='customer'?x.amount:-x.amount)});
  DB.returns.forEach(r=>{if(a==='Cash'&&!r.partyId)add(r.date,'Return '+r.no,-r.amount)});
  DB.cash.forEach(c=>{if(!c.noacct&&(c.acct||'Cash')===a)add(c.date,c.cat+(c.note?' · '+c.note:''),c.type==='income'?c.amount:-c.amount)});
  DB.invest.forEach(i=>{if(i.acct===a)add(i.date,i.type==='invest'?'Capital added':'Withdrawal',i.type==='invest'?i.amount:-i.amount)});
  DB.loans.forEach(l=>{if(l.acct===a)add(l.date,'Loan '+(l.type==='taken'?'received from ':'given to ')+l.name,l.type==='taken'?l.amount:-l.amount);l.pay.forEach(r=>{if(r.acct===a)add(r.date,'Loan repayment · '+l.name,l.type==='taken'?-r.amount:r.amount)})});
  DB.btx.forEach(t=>{if(t.from===a)add(t.date,'Transfer to '+t.to,-t.amount);if(t.to===a)add(t.date,'Transfer from '+t.from,t.amount)});
  return E.sort((x,y)=>y.d.localeCompare(x.d))}
const acctBal=a=>r2(num(DB.acct[a])+sum(acctEntries(a),e=>e.amt));
const acctLabel=a=>a==='Cash'?'Cash in hand':a==='Bank'?'Bank (Card / Bank)':a,acctIco=a=>a==='Cash'?'coins':a==='Bank'?'bank':'wallet';

const EAN_L=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
const EAN_G=['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
const EAN_P=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
const eanCheck=d=>{let s=0;for(let i=0;i<12;i++)s+=(+d[i])*(i%2?3:1);return (10-s%10)%10};
const eanValid=c=>/^\d{13}$/.test(c)&&eanCheck(c)===+c[12];
function eanBits(c){const par=EAN_P[+c[0]];let b='101';for(let i=1;i<=6;i++)b+=par[i-1]==='L'?EAN_L[+c[i]]:EAN_G[+c[i]];b+='01010';for(let i=7;i<=12;i++)b+=EAN_L[+c[i]].split('').map(x=>x==='1'?'0':'1').join('');return b+'101'}
function barSvg(c){if(!eanValid(c))return '';const bits=eanBits(c),q=9,W=95+q*2;let r='',i=0;while(i<95){if(bits[i]==='1'){let j=i;while(j<95&&bits[j]==='1')j++;const guard=(i<3||(i>=45&&i<50)||i>=92);r+=`<rect x="${q+i}" y="6" width="${j-i}" height="${guard?64:58}" fill="#000"/>`;i=j}else i++}
  const t=(x,s)=>`<text x="${x}" y="78" font-size="9" font-family="monospace" fill="#000" text-anchor="middle">${s}</text>`;
  return `<svg id="bc-svg" viewBox="0 0 ${W} 84" width="100%" style="max-width:320px;background:#fff;border-radius:8px" role="img" aria-label="Barcode ${c}"><rect width="${W}" height="84" fill="#fff"/>${r}${t(q-5,c[0])}${t(q+3+21,c.slice(1,7).split('').join(' '))}${t(q+50+21,c.slice(7).split('').join(' '))}</svg>`}
function genCode(){for(let t=0;t<50;t++){let d='2';for(let i=0;i<11;i++)d+=Math.floor(Math.random()*10);const c=d+eanCheck(d);if(!DB.products.some(p=>p.barcode===c))return c}return ''}

const pdfTxt=t=>String(t).replace(/[^\x20-\x7e]/g,'?').replace(/[\\()]/g,'\\$&');
function labelsPdf(items,o,site){
  const W=595,H=842,M=18,cols=3,rows=8,lw=(W-2*M)/cols,lh=(H-2*M)/rows,per=cols*rows,list=[];
  items.forEach(it=>{for(let i=0;i<it.copies;i++)list.push(it)});
  const pages=[];
  for(let pg=0;pg<Math.max(1,Math.ceil(list.length/per));pg++){let c='0.8 G 0.5 w\n';
    list.slice(pg*per,pg*per+per).forEach((it,k)=>{const col=k%cols,row=Math.floor(k/cols),x0=M+col*lw,yTop=H-M-row*lh,cx=x0+lw/2;
      c+=`${x0+3} ${yTop-lh+3} ${lw-6} ${lh-6} re S\n0 g\n`;
      const parts=[];
      const T=(txt,sz,bold)=>{const max=Math.floor((lw-12)/(sz*0.52));let t=pdfTxt(txt);if(t.length>max)t=t.slice(0,max-1)+'.';return{h:sz+3,draw:y=>`BT /${bold?'F2':'F1'} ${sz} Tf ${(cx-t.length*sz*(bold?0.28:0.26)).toFixed(1)} ${y.toFixed(1)} Td (${t}) Tj ET\n`}};
      if(o.site&&site)parts.push(T(site,7,true));
      if(o.name)parts.push(T(it.name,8.5,false));
      parts.push({h:36,draw:y=>{const bits=eanBits(it.code),mw=1.05,bx=cx-47.5*mw;let r='',i=0;while(i<95){if(bits[i]==='1'){let j=i;while(j<95&&bits[j]==='1')j++;r+=`${(bx+i*mw).toFixed(2)} ${(y-34).toFixed(1)} ${((j-i)*mw).toFixed(2)} 34 re\n`;i=j}else i++}return r+'f\n'}});
      if(o.code)parts.push(T(it.code,7.5,false));
      if(o.price)parts.push(T('Rs. '+it.price,10,true));
      const tot=parts.reduce((a,p)=>a+p.h,0);let y=yTop-(lh-tot)/2-2;
      parts.forEach(p=>{if(p.h===36){c+=p.draw(y)}else c+=p.draw(y-p.h+3);y-=p.h});
    });pages.push(c)}
  let out='%PDF-1.4\n';const off=[],add=t=>{off.push(out.length);out+=t};
  add('1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n');
  add(`2 0 obj<</Type/Pages/Kids[${pages.map((_,i)=>(5+2*i)+' 0 R').join(' ')}]/Count ${pages.length}>>endobj\n`);
  add('3 0 obj<</Type/Font/Subtype/Type1/BaseFont/Helvetica>>endobj\n');add('4 0 obj<</Type/Font/Subtype/Type1/BaseFont/Helvetica-Bold>>endobj\n');
  pages.forEach((c,i)=>{add(`${5+2*i} 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${W} ${H}]/Resources<</Font<</F1 3 0 R/F2 4 0 R>>>>/Contents ${6+2*i} 0 R>>endobj\n`);add(`${6+2*i} 0 obj<</Length ${c.length}>>stream\n${c}\nendstream\nendobj\n`)});
  const xr=out.length;out+=`xref\n0 ${off.length+1}\n0000000000 65535 f \n`+off.map(x=>String(x).padStart(10,'0')+' 00000 n \n').join('')+`trailer<</Size ${off.length+1}/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`;
  return out}
async function sharePdf(pdf,name,ttl){ttl=ttl||'Barcodes';const C=window.Capacitor;
  try{if(C&&C.isNativePlatform&&C.isNativePlatform()){const FS=C.registerPlugin('Filesystem'),SH=C.registerPlugin('Share'),w=await FS.writeFile({path:name,data:btoa(pdf),directory:'CACHE'});await SH.share({title:ttl,files:[w.uri]});return true}}catch(e){if(e&&/cancel/i.test(String(e.message||e)))return true}
  const u8=Uint8Array.from(pdf,c=>c.charCodeAt(0));
  try{const f=new File([u8],name,{type:'application/pdf'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:ttl});return true}}catch(e){if(e&&e.name==='AbortError')return true}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([u8],{type:'application/pdf'}));a.download=name;document.body.appendChild(a);a.click();a.remove();return true}catch(e){}
  return false}

function nWords(n){const o=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],t=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
 const two=x=>x<20?o[x]:t[Math.floor(x/10)]+(x%10?' '+o[x%10]:'');
 const three=x=>(x>=100?o[Math.floor(x/100)]+' Hundred'+(x%100?' ':''):'')+(x%100?two(x%100):'');
 n=Math.round(Math.abs(n)*100);let rs=Math.floor(n/100),ps=n%100,w=[];
 const cr=Math.floor(rs/1e7);rs%=1e7;const lk=Math.floor(rs/1e5);rs%=1e5;const th=Math.floor(rs/1e3);rs%=1e3;
 if(cr)w.push(three(cr)+' Crore');if(lk)w.push(two(lk)+' Lakh');if(th)w.push(two(th)+' Thousand');if(rs)w.push(three(rs));
 let r=w.join(' ')||'Zero';if(ps)r+=' and '+two(ps)+' paise';return 'INR '+r+' Only'}

  exn(el){CART.extras[+el.dataset.n].n=el.value},exa(el){CART.extras[+el.dataset.n].a=el.value;updTotals()}
};
function logoLoad(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=260,k=Math.min(1,m/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*k)),h=Math.max(1,Math.round(im.height*k)),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);res({d:c.toDataURL('image/jpeg',0.85),w,h})};im.onerror=()=>res(null);im.src=r.result};r.onerror=()=>res(null);r.readAsDataURL(file)})}
const CHG={
  logofile:async el=>{const f=el.files&&el.files[0];if(!f)return;const o=await logoLoad(f);if(!o)return toast('Could not read this image');DB.shop.logo=o.d;DB.shop.logoW=o.w;DB.shop.logoH=o.h;save();toast('Logo saved');render()},
  autotog(el){DB.autoOff=!el.checked;save();if(el.checked)autoSnap();render()},

  hdate(el){UI.hd=el.value||today();render()},

/* ---------- cloud sync (Firebase REST) ---------- */
const FBK='billbook-fb';let FB=(()=>{try{return JSON.parse(localStorage.getItem(FBK)||'{}')||{}}catch(e){return{}}})();
const fbSave=()=>{try{localStorage.setItem(FBK,JSON.stringify(FB))}catch(e){}};
const fbReady=()=>!!(FB.apiKey&&FB.projectId),fbOn=()=>fbReady()&&!!FB.refresh;
const fbErr=m=>({EMAIL_EXISTS:'This email already has an account. Tap Sign in.',INVALID_LOGIN_CREDENTIALS:'Wrong email or password.',INVALID_PASSWORD:'Wrong email or password.',EMAIL_NOT_FOUND:'No account for this email. Tap Create account.',WEAK_PASSWORD:'Password must have at least 6 characters.',INVALID_EMAIL:'Enter a valid email.',OPERATION_NOT_ALLOWED:'Turn on Email/Password in Firebase Authentication.'}[String(m||'').split(' ')[0]]||('Cloud error: '+m));
async function u8b64(u){let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)}
async function gz(txt){try{if(typeof CompressionStream==='undefined')throw 0;const st=new Blob([txt]).stream().pipeThrough(new CompressionStream('gzip'));return{enc:'gz',data:await u8b64(new Uint8Array(await new Response(st).arrayBuffer()))}}catch(e){return{enc:'raw',data:txt}}}
async function ungz(enc,data){if(enc!=='gz')return data;const b=Uint8Array.from(atob(data),c=>c.charCodeAt(0)),st=new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'));return await new Response(st).text()}
async function fbAuth(mode,email,pw){const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:'+(mode==='up'?'signUp':'signInWithPassword')+'?key='+encodeURIComponent(FB.apiKey),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pw,returnSecureToken:true})}),j=await r.json();if(!r.ok)throw new Error(fbErr(j.error&&j.error.message));FB.refresh=j.refreshToken;FB.uid=j.localId;FB.email=email;FB.S=0;fbSave()}
async function fbTok(){const r=await fetch('https://securetoken.googleapis.com/v1/token?key='+encodeURIComponent(FB.apiKey),{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(FB.refresh)}),j=await r.json();if(!r.ok)throw new Error(fbErr(j.error&&j.error.message));FB.refresh=j.refresh_token||FB.refresh;FB.uid=j.user_id||FB.uid;fbSave();return j.id_token}
const fbDoc=()=>'https://firestore.googleapis.com/v1/projects/'+encodeURIComponent(FB.projectId)+'/databases/(default)/documents/users/'+FB.uid+'/sync/main';
async function fbGet(tok){const r=await fetch(fbDoc(),{headers:{Authorization:'Bearer '+tok}});if(r.status===404)return null;const j=await r.json();if(!r.ok)throw new Error(fbErr(j.error&&(j.error.status||j.error.message)));const f=j.fields||{};return{t:+((f.t||{}).integerValue||0),ut:j.updateTime||'',json:await ungz(((f.enc||{}).stringValue)||'raw',((f.json||{}).stringValue)||'')}}
async function fbPut(tok,json,t,ut){const z=await gz(json),r=await fetch(fbDoc()+'?'+(ut?'currentDocument.updateTime='+encodeURIComponent(ut):'currentDocument.exists=false'),{method:'PATCH',headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({fields:{json:{stringValue:z.data},enc:{stringValue:z.enc},t:{integerValue:String(t)}}})});if(!r.ok){const j=await r.json().catch(()=>({})),st=j.error&&j.error.status;if(st==='FAILED_PRECONDITION'||st==='ABORTED'||st==='ALREADY_EXISTS'||r.status===409||r.status===412){const e=new Error('conflict');e.conflict=true;throw e}throw new Error(fbErr(j.error&&(st||j.error.message)))}}
/* --- merge two phones' data (3-way: last synced copy, this phone, cloud) --- */
const BASEK='billbook-base';
const getBase=()=>{try{return JSON.parse(localStorage.getItem(BASEK)||'null')}catch(e){return null}};
const setBase=j=>{try{localStorage.setItem(BASEK,j)}catch(e){try{localStorage.removeItem(BASEK)}catch(_){}}};
const cj=v=>JSON.stringify(v,(k,x)=>x&&typeof x==='object'&&!Array.isArray(x)?Object.keys(x).sort().reduce((o,y)=>(o[y]=x[y],o),{}):x);
const isO=x=>x&&typeof x==='object'&&!Array.isArray(x);
const MSKIP={modAt:1,lastAuto:1,lastBackup:1};
function m3(b,l,r,k,p){
  if(cj(l)===cj(b))return r;if(cj(r)===cj(b))return l;if(cj(l)===cj(r)&&(!l||typeof l!=='object'))return l;
  if(typeof l==='number'&&typeof r==='number'){if(k==='stock'&&typeof b==='number')return qf(r+(l-b));if(p==='seq')return Math.max(l,r);return l}
  if(Array.isArray(l)&&Array.isArray(r))return marr(Array.isArray(b)?b:[],l,r);
  if(isO(l)&&isO(r)){const o={},bb=isO(b)?b:{};new Set([...Object.keys(bb),...Object.keys(l),...Object.keys(r)]).forEach(x=>{if(MSKIP[x]&&!k){o[x]=l[x];return}const v=m3(bb[x],l[x],r[x],x,k);if(v!==undefined)o[x]=v});return o}
  return l}
function marr(b,l,r){
  const idd=a=>a.length&&a.every(x=>x&&typeof x==='object'&&x.id!==undefined);
  if(idd(l)||idd(r)||idd(b)){
    const bm=new Map(b.map(x=>[x.id,x])),lm=new Map(l.map(x=>[x.id,x])),rm=new Map(r.map(x=>[x.id,x])),out=[];
    r.forEach(x=>{if(!lm.has(x.id)){if(!bm.has(x.id))out.push(x);return}{let z=m3(bm.get(x.id),lm.get(x.id),x);const bo=bm.get(x.id),lo=lm.get(x.id);if(bo&&isO(z)&&typeof lo.stock==='number'&&typeof x.stock==='number'&&typeof bo.stock==='number')z=Object.assign({},z,{stock:qf(x.stock+(lo.stock-bo.stock))});out.push(z)}});
    l.forEach(x=>{if(!rm.has(x.id)&&!bm.has(x.id))out.push(x)});
    return out}
  const bs=new Set(b.map(cj)),ls=new Set(l.map(cj)),rs=new Set(r.map(cj));
  const out=r.filter(x=>{const s=cj(x);return !(bs.has(s)&&!ls.has(s))});
  l.forEach(x=>{const s=cj(x);if(!rs.has(s)&&!bs.has(s))out.push(x)});
  return out}
function fixNos(res,base){
  [['sales','sale'],['purchases','pur'],['returns','ret'],['quotes','quote']].forEach(([a,s])=>{
    const arr=res[a]||[],bi=new Set(((base||{})[a]||[]).map(x=>x.id)),cnt={};
    arr.forEach(d=>{cnt[d.no]=(cnt[d.no]||0)+1});
    let mx=res.seq[s]||0;arr.forEach(d=>{const m=/^[A-Za-z]+-(\d+)$/.exec(d.no||'');if(m)mx=Math.max(mx,+m[1])});
    arr.forEach(d=>{if(cnt[d.no]>1&&!bi.has(d.id)&&/^[A-Za-z]+-\d+$/.test(d.no)){cnt[d.no]--;d.no=d.no.replace(/\d+$/,'')+String(++mx).padStart(4,'0')}});
    res.seq[s]=mx})}
function softRender(){const e=document.activeElement;if(e&&/^(INPUT|TEXTAREA|SELECT)$/.test(e.tagName))return;if(/form|^(sale|purchase|quote|return|cart|bill|invoice)/i.test(cur.name))return;render()}
async function cloudPush(tok,ut){const t=Date.now(),snap=JSON.stringify(DB);await fbPut(tok||await fbTok(),snap,t,ut);FB.S=t;FB.last=t;fbSave();setBase(snap)}
function cloudApply(c){DB=ensure(JSON.parse(c.json));DB.modAt=c.t;FB.S=c.t;FB.last=Date.now();fbSave();save(true);setBase(JSON.stringify(DB));syncAccts();applyTheme()}
async function cloudSync(manual){if(!fbOn()||cloudSync.busy)return;cloudSync.busy=true;UI.syncMsg='Syncing…';if(manual)render();let changed=false;
  try{const tok=await fbTok();
    for(let n=0;n<4;n++){
      const c=await fbGet(tok),S=FB.S||0,M=DB.modAt||0;
      if(!c){await cloudPush(tok,'');UI.syncMsg='Backed up to cloud';break}
      if(c.t<=S&&!(DB.sample&&!S)){
        if(M>S){try{await cloudPush(tok,c.ut);UI.syncMsg='Backed up to cloud'}catch(e){if(e.conflict)continue;throw e}}
        else{FB.last=Date.now();fbSave();UI.syncMsg='Up to date'}
        break}
      const R=JSON.parse(c.json),base=getBase();
      if((DB.sample&&!S)||(!base&&M<=S)){cloudApply(c);UI.syncMsg='Latest data loaded from cloud';changed=true;break}
      const mg=ensure(m3(base||{},DB,R));fixNos(mg,base||{});
      const same=cj(Object.assign({},mg,{modAt:0}))===cj(Object.assign({},ensure(JSON.parse(c.json)),{modAt:0}));
      DB=mg;
      if(same){DB.modAt=c.t;FB.S=c.t;FB.last=Date.now();fbSave();save(true);setBase(JSON.stringify(DB));UI.syncMsg='Latest data loaded from cloud';changed=true;break}
      try{await cloudPush(tok,c.ut);save(true);UI.syncMsg='Both phones merged';changed=true;break}catch(e){if(e.conflict)continue;throw e}
    }
    syncAccts();
  }catch(e){UI.syncMsg=(e&&e.message)||'No internet. Will try again.'}
  cloudSync.busy=false;if(manual)render();else if(changed||['backup'].includes(cur.name))softRender()}
function schedPush(){if(!fbOn())return;clearTimeout(schedPush.h);schedPush.h=setTimeout(()=>cloudSync(),3000)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(Date.now()-(cloudSync.lastRun||0)>15000){cloudSync.lastRun=Date.now();cloudSync()}}else if(fbOn()&&(DB.modAt||0)>(FB.S||0)){clearTimeout(schedPush.h);cloudSync()}});
setInterval(()=>{if(document.visibilityState==='visible'&&fbOn()&&!cloudSync.busy)cloudSync()},20000);
